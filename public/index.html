<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shkurto — Shkurto linket e gjata</title>
<meta name="description" content="Shkurto — Shkurto linket e gjata, me alias custom, QR code, skadencë dhe statistika klikimesh.">
<meta name="theme-color" content="#0b0f1a">
<meta property="og:title" content="Shkurto — Shkurto linket e gjata">
<meta property="og:description" content="Ngjit një link të gjatë, merr një link të shkurtër — me QR code, alias custom dhe statistika klikimesh.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>Shkurto</div>
  <div class="tagline">Shkurto linket e gjata</div>
</header>

<main class="container">
  <section class="hero">
    <h1>Shkurto linket e gjata</h1>
    <p class="subtitle">Ngjit një link të gjatë, merr një link të shkurtër — me QR code, alias custom dhe statistika.</p>
  </section>

  <section class="stats" id="stats">
    <div class="stat-card"><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span><span class="stat-num" id="statTotalLinks">0</span><span class="stat-label">Total linke</span></div>
    <div class="stat-card"><span class="stat-icon teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span><span class="stat-num" id="statTotalClicks">0</span><span class="stat-label">Total klikime</span></div>
    <div class="stat-card"><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></span><span class="stat-num" id="statToday">0</span><span class="stat-label">Sot</span></div>
    <div class="stat-card"><span class="stat-icon teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></span><span class="stat-num" id="statWeek">0</span><span class="stat-label">Këtë javë</span></div>
  </section>

  <section class="card">
    <form id="shortenForm" novalidate>
      <label for="longUrl">Linku i gjatë</label>
      <input type="url" id="longUrl" placeholder="https://shembull.com/nje-link-shume-i-gjate..." required inputmode="url" autocomplete="off" spellcheck="false">

      <div class="row">
        <div class="field">
          <label for="customAlias">Alias custom (opsional)</label>
          <input type="text" id="customAlias" placeholder="p.sh. oferta-ime" maxlength="30" autocomplete="off" spellcheck="false">
        </div>
        <div class="field">
          <label for="expiration">Skadenca</label>
          <select id="expiration">
            <option value="never">Kurrë</option>
            <option value="24h">24 orë</option>
            <option value="7d">7 ditë</option>
            <option value="30d">30 ditë</option>
          </select>
        </div>
      </div>

      <button type="submit" id="shortenBtn">Shkurto</button>
      <p id="errorMsg" class="error" hidden></p>
    </form>

    <div id="result" class="result" hidden>
      <label for="shortUrl">Linku yt i shkurtër</label>
      <div class="result-row">
        <input type="text" id="shortUrl" readonly>
        <button type="button" id="copyBtn">Kopjo</button>
      </div>
      <div class="qr-wrap">
        <a id="qrLink" href="#" target="_blank" rel="noopener"><img id="qrImg" alt="QR code i linkut të shkurtër" width="180" height="180"></a>
        <p class="qr-label">QR Code — skanoje për ta hapur</p>
        <a id="qrDownload" class="btn-secondary qr-download" href="#" download="qr-shkurto.png">Shkarko QR</a>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="dash-head">
      <h2>Linket e mia</h2>
      <button type="button" id="refreshBtn" class="btn-secondary">Rifresko</button>
    </div>
    <div id="linksList" class="links-list" aria-live="polite">
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-line w45"></div><div class="skeleton-line w90"></div><div class="skeleton-line w70"></div></div>
      <div class="skeleton-card" aria-hidden="true"><div class="skeleton-line w45"></div><div class="skeleton-line w90"></div><div class="skeleton-line w70"></div></div>
    </div>
  </section>
</main>

<footer>
  <p>Krijuar nga Erion Nezha · <a href="https://github.com/ErionNezha/shkurto" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Kodi burim</a></p>
</footer>

<script src="script.js"></script>
</body>
</html>
